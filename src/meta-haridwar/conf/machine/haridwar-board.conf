# @TYPE: Machine
# @NAME: Custom AM62x Board
# @DESCRIPTION: Machine configuration for our custom TI AM62x SoC board

# Inherit the base AM62xx settings from meta-ti
require conf/machine/include/am62xx.inc

# 1. Define your custom Linux Kernel Device Tree (DTB)
# Replace 'k3-am625-customboard.dtb' with your actual custom device tree filename
KERNEL_DEVICETREE = "ti/k3-am625-customboard.dtb"

# 2. Define U-Boot build targets specific to your board configuration
UBOOT_MACHINE = "custom_board_a53_defconfig"

# 3. Handle Boot Partition files (Must match what your U-Boot expects)
# For AM62x, tiboot3.bin comes from the r5 build, tispl.bin and u-boot.img from this build
IMAGE_BOOT_FILES = " \
    tiboot3.bin \
    tispl.bin \
    u-boot.img \
"